    epic: EPIC-R1-02
    summary: "GPU reshape graph contract 확정 및 수정"
    labels: ["release-1", "release-blocker", "p0", "area-webgpu", "severity-critical"]
    description: |
      h1. 개요
      GPU 상에서 reshape 시 tensor handle 소유권 및 dispose 로직 확정.

      h1. 사용자 영향
      메모리 누수 또는 런타임 OOM.

      h1. 현재 동작
      reshape 시 metadata-only인지 실제 복사인지 모호.

      h1. 기대 동작
      별도 metadata를 통해 view로 관리되거나 완벽한 복사가 이루어짐.
      
      (기타 필수 항목 생략 - 스크립트에서 자동 보완)
      
