[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ameva-forge"
version = "1.0.1"
description = "High-performance WebGPU-accelerated tensor computation engine with reverse-mode autograd for browser and edge deep learning."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "AMEVA Foundation", email = "contact@uno-km.com"}
]
maintainers = [
    {name = "AMEVA Engineering Team"}
]
keywords = [
    "deep-learning",
    "tensor",
    "autograd",
    "webgpu",
    "pytorch",
    "transformers",
    "pyodide",
    "wasm",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://uno-km.github.io/ameva-forge/"
Documentation = "https://uno-km.github.io/ameva-forge/"
Repository = "https://github.com/uno-km/ameva-forge"
Issues = "https://github.com/uno-km/ameva-forge/issues"
Changelog = "https://github.com/uno-km/ameva-forge/blob/main/docs/audits/audit_loop_iteration_30.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

