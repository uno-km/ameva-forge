[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ameva_tensor"
version = "0.1.0"
description = "Browser-native Tensor Runtime wrapping @ameva/tensor for Pyodide"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0"
]

[tool.setuptools.packages.find]
where = ["src"]
