name: AMEVA-Forge Headless WebGPU & Full Verification Gate

on:
  push:
    branches: [ main, "release*/**", "hardening/**" ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Full Contract, Unit & Headless WebGPU Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/forge/package-lock.json

      - name: Install System Graphics & Vulkan Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools \
            xvfb

      - name: Check Single Source Op Contract
        run: |
          python -m pip install --upgrade pip build
          python scripts/generate_release1_contracts.py --check

      - name: Run Documentation Claim Linter
        run: |
          python scripts/lint_unverified_claims.py

      - name: Python Wheel Build & Pytest Suite
        run: |
          cd packages/forge-py
          pip install -e . pytest
          python tests/run_all_tests.py
          python -m pytest tests -q

      - name: TypeScript Build & Unit Suite
        run: |
          cd packages/forge
          npm ci
          npm run build
          npm run test:unit -- --runInBand
          npx tsc --noEmit

      - name: Install Playwright Browsers
        run: |
          cd packages/forge
          npx playwright install --with-deps chromium

      - name: Run Headless WebGPU E2E Suite under SwiftShader / Xvfb
        run: |
          cd packages/forge
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 -ac" \
            npx playwright test --project=dev-webgpu
