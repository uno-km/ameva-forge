<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMEVA-Forge: In-Browser WebGPU Diffusion Studio</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: #0284c7;
      color: white;
      vertical-align: middle;
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-top: 16px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .row {
      display: flex;
      gap: 16px;
    }
    .col {
      flex: 1;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      width: 100%;
    }
    button:hover {
      background: #7dd3fc;
    }
    button:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 16px;
      display: none;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.2s;
    }
    .canvas-container {
      margin-top: 24px;
      text-align: center;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      min-height: 512px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 6px;
      max-width: 100%;
      height: auto;
    }
    .status-text {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      AMEVA-Forge Diffusion Studio
      <span class="badge">WebGPU Zero-Heap GGUF</span>
    </h1>
    <p style="color: #94a3b8; font-size: 0.9rem;">
      브라우저 단독 WebAssembly 및 WebGPU 가속 기반 온디바이스 GGUF 디퓨전 이미지 생성 스튜디오 (Server Cost: 0원)
    </p>

    <div class="panel">
      <div class="form-group">
        <label>텍스트 프롬프트 (Prompt)</label>
        <input type="text" id="prompt" value="a serene cyberpunk city with neon lights and flying cars, highly detailed, 8k" />
      </div>

      <div class="row">
        <div class="col form-group">
          <label>사전 정의 모델 (Preset Model)</label>
          <select id="model-preset">
            <option value="sdxs-q8_0">SDXS-512 (Q8_0, 651MB) - 1~2 Step Ultra Fast</option>
            <option value="sd-turbo-q4_k">SD-Turbo (Q4_K, 1.1GB) - 1~4 Step Balanced</option>
          </select>
        </div>
        <div class="col form-group">
          <label>디노이징 스텝 수 (Steps)</label>
          <select id="steps">
            <option value="1">1 Step (Ultra Fast)</option>
            <option value="2" selected>2 Steps (Recommended)</option>
            <option value="4">4 Steps (High Quality)</option>
          </select>
        </div>
        <div class="col form-group">
          <label>랜덤 시드 (Seed)</label>
          <input type="text" id="seed" value="42" />
        </div>
      </div>

      <button id="btn-generate" onclick="window.runGeneration()">WebGPU 디퓨전 이미지 생성 시작</button>

      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="status-text" id="status-text">대기 중... (WebGPU 어댑터 준비 완료)</div>

      <div class="canvas-container">
        <canvas id="output-canvas" width="512" height="512"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import { WebGPUDiffusionPipeline } from '../docs/dist/index.esm.js';

    window.runGeneration = async function() {
      const btn = document.getElementById('btn-generate');
      const prompt = document.getElementById('prompt').value;
      const steps = parseInt(document.getElementById('steps').value, 10);
      const seed = parseInt(document.getElementById('seed').value, 10);
      const statusText = document.getElementById('status-text');
      const progressBar = document.getElementById('progress-bar');
      const progressFill = document.getElementById('progress-fill');
      const canvas = document.getElementById('output-canvas');
      const ctx = canvas.getContext('2d');

      btn.disabled = true;
      progressBar.style.display = 'block';
      progressFill.style.width = '0%';
      statusText.innerText = '파이프라인 초기화 중... (WebGPU 버퍼 준비)';

      try {
        const pipeline = new WebGPUDiffusionPipeline();

        const image = await pipeline.generate({
          prompt,
          numSteps: steps,
          width: 512,
          height: 512,
          seed,
          onProgress: (p) => {
            progressFill.style.width = p.percentage + '%';
            statusText.innerText = '디노이징 진행 중... [Step ' + p.step + '/' + p.totalSteps + '] (' + p.percentage + '%) - 경과 시간: ' + Math.round(p.elapsedMs) + 'ms';
          }
        });

        const imgData = ctx.createImageData(512, 512);
        imgData.data.set(image.rgbaData);
        ctx.putImageData(imgData, 0, 0);

        statusText.innerText = '생성 완료! (512x512 RGBA Canvas 렌더링 성공)';
      } catch (err) {
        console.error(err);
        statusText.innerText = '오류 발생: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
